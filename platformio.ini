; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = d1_mini_dht11

[env]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 9600
board_build.filesystem = littlefs
build_flags =
    -D SOLENOID_PIN=D1
lib_deps =
    ayushsharma82/ElegantOTA@^3.1.0
    khoih-prog/ESP_MultiResetDetector@^1.3.0
    knolleary/PubSubClient@^2.8

; DHT11 shield (default — matches the currently deployed hardware). DHTPIN=D4
; shares GPIO2 with LED_BUILTIN — see the note in pins.h and task_led.cpp.
[env:d1_mini_dht11]
build_flags =
    ${env.build_flags}
    -D DHTPIN=D4
build_src_filter = +<*> -<tasks/task_sensors_sht30.cpp>
lib_deps =
    ${env.lib_deps}
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor

; SHT30 shield (I2C) — swap in via: pio run -e d1_mini_sht30 [-t upload]
[env:d1_mini_sht30]
build_flags =
    ${env.build_flags}
    -D SDA_PIN=D2
    -D SCL_PIN=D6
build_src_filter = +<*> -<tasks/task_sensors_dht.cpp>
lib_deps =
    ${env.lib_deps}
    robtillaart/SHT31@^0.5.3
