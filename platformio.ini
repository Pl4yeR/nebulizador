; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = d1_mini_dht11

[env]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 9600
board_build.filesystem = littlefs
lib_deps =
    ayushsharma82/ElegantOTA@^3.1.0
    khoih-prog/ESP_MultiResetDetector@^1.3.0
    knolleary/PubSubClient@^2.8

; DHT11 shield (default — matches the currently deployed hardware). The
; shield's factory pin is D4, but that's LED_BUILTIN and the DHT11 treats any
; LED blink as a read start signal (see CLAUDE.md) — the shield is physically
; rewired to D5, which is what this flag reflects.
[env:d1_mini_dht11]
build_flags =
    ${env.build_flags}
    -D SOLENOID_PIN=D3
    -D DHTPIN=D8
build_src_filter = +<*> -<tasks/task_sensors_sht30.cpp>
lib_deps =
    ${env.lib_deps}
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor

; SHT30 shield (I2C) — swap in via: pio run -e d1_mini_sht30 [-t upload]
[env:d1_mini_sht30]
build_flags =
    ${env.build_flags}
    -D SOLENOID_PIN=D3
    -D SDA_PIN=D2
    -D SCL_PIN=D1
build_src_filter = +<*> -<tasks/task_sensors_dht.cpp>
lib_deps =
    ${env.lib_deps}
    robtillaart/SHT31@^0.5.3
